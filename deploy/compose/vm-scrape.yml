# Scrape config of the bundled VictoriaMetrics. Add your exporters below
# (node-exporter, windows_exporter, pve-exporter, kube-state-metrics, ...).
global:
  scrape_interval: 60s
scrape_configs:
  - job_name: victoriametrics
    static_configs: [{targets: ["127.0.0.1:8428"]}]
  # Probe targets are generated by ICC from inventory.yaml (probe: http | icmp | tcp:<port>)
  - job_name: blackbox
    metrics_path: /probe
    http_sd_configs:
      - url: http://icc:8081/sd/probes.json
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [module], target_label: __param_module}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox:9115"}
