<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · InfraCommandCenter</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-hero"><img src="/logo.svg" alt="" width="44" height="44"><div><h1 class="wordmark" aria-label="InfraCommandCenter">Infra<b>Command</b>Center</h1><p class="company" id="l-name"></p></div></div>
      <div class="form" style="padding:16px 24px 0" id="sso" hidden><button type="button" class="primary sso" id="sso-btn">Sign in with SSO</button><div class="login-alt" id="sso-or">or</div></div>
      <form id="login" class="form" autocomplete="on" hidden>
        <label>Username<input name="user" autocomplete="username" required autofocus></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Sign in</button>
        <div id="msg" class="faint"></div>
      </form>
      <div class="faint" id="l-ver" style="padding:0 24px 16px;font-size:11.5px"></div>
    </div>
  </main>
  <script src="/login.js"></script>
</body>
</html>
