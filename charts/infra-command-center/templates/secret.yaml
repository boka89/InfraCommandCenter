{{- $full := include "icc.fullname" . -}}
{{- if and (has "local" .Values.auth.providers) (not .Values.auth.local.existingSecret) }}
{{- $name := printf "%s-admin" $full }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
# Generated admin password (kept across upgrades). Read it with:
#   kubectl -n {{ .Release.Namespace }} get secret {{ $name }} -o jsonpath='{.data.admin-password}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "icc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ if $old }}{{ index $old.data "admin-password" }}{{ else }}{{ randAlphaNum 20 | b64enc }}{{ end }}
{{- end }}
{{- if and .Values.ai.deploy.enabled (not .Values.ai.existingSecret) }}
{{- $name := printf "%s-hermes" $full }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
---
# API key shared by ICC and the bundled Hermes Agent API server
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "icc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  api-key: {{ if $old }}{{ index $old.data "api-key" }}{{ else }}{{ randAlphaNum 40 | b64enc }}{{ end }}
{{- end }}
