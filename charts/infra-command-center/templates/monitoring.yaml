{{- $full := include "icc.fullname" . -}}
{{- $mon := .Values.monitoring -}}
{{- if and $mon.victoriametrics.enabled (not $mon.url) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-vm
  labels: {{- include "icc.labels" . | nindent 4 }}
data:
  scrape.yml: |
    global:
      scrape_interval: 60s
    scrape_configs:
      - job_name: victoriametrics
        static_configs: [{targets: ["127.0.0.1:8428"]}]
      {{- if $mon.blackbox.enabled }}
      # Probe targets are generated by ICC from inventory.yaml (probe: http | icmp | tcp:<port>).
      - job_name: blackbox
        metrics_path: /probe
        http_sd_configs:
          - url: http://{{ $full }}-sd:8081/sd/probes.json
        relabel_configs:
          - {source_labels: [__address__], target_label: __param_target}
          - {source_labels: [module], target_label: __param_module}
          - {source_labels: [__param_target], target_label: instance}
          - {target_label: __address__, replacement: "{{ $full }}-blackbox:9115"}
      {{- end }}
      {{- with $mon.victoriametrics.extraScrapeConfigs }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-vm
  labels: {{- include "icc.labels" . | nindent 4 }}
    app.kubernetes.io/component: victoriametrics
spec:
  serviceName: {{ $full }}-vm
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: victoriametrics}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: victoriametrics}
      annotations:
        checksum/scrape: {{ toJson $mon | sha256sum }}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534}
      containers:
        - name: vm
          image: {{ $mon.victoriametrics.image }}
          args:
            - -storageDataPath=/storage
            - -retentionPeriod={{ $mon.victoriametrics.retention }}
            - -promscrape.config=/etc/vm/scrape.yml
            - -promscrape.configCheckInterval=30s
            - -promscrape.httpSDCheckInterval=60s
          ports: [{name: http, containerPort: 8428}]
          readinessProbe: {httpGet: {path: /health, port: http}}
          resources: {{- toYaml $mon.victoriametrics.resources | nindent 12 }}
          volumeMounts:
            - {name: storage, mountPath: /storage}
            - {name: config, mountPath: /etc/vm}
      volumes:
        - name: config
          configMap: {name: {{ $full }}-vm}
  volumeClaimTemplates:
    - metadata: {name: storage}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ $mon.victoriametrics.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-vm
  labels: {{- include "icc.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: victoriametrics}
  ports: [{name: http, port: 8428, targetPort: http}]
{{- end }}
{{- if $mon.blackbox.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-blackbox
  labels: {{- include "icc.labels" . | nindent 4 }}
data:
  blackbox.yml: |
    modules:
      # any answer from a web server counts as "up" (many admin UIs answer 401/403/302)
      http:
        prober: http
        timeout: 8s
        http:
          preferred_ip_protocol: ip4
          follow_redirects: true
          valid_status_codes: [200, 201, 202, 204, 301, 302, 303, 307, 308, 400, 401, 403, 404, 405]
          tls_config: {insecure_skip_verify: true}
      tcp:
        prober: tcp
        timeout: 5s
        tcp: {preferred_ip_protocol: ip4}
      icmp:
        prober: icmp
        timeout: 5s
        icmp: {preferred_ip_protocol: ip4}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-blackbox
  labels: {{- include "icc.labels" . | nindent 4 }}
    app.kubernetes.io/component: blackbox
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: blackbox}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: blackbox}
    spec:
      {{- if $mon.blackbox.dnsServers }}
      dnsPolicy: None
      dnsConfig:
        nameservers: {{- toYaml $mon.blackbox.dnsServers | nindent 10 }}
        {{- with $mon.blackbox.dnsSearches }}
        searches: {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      containers:
        - name: blackbox
          image: {{ $mon.blackbox.image }}
          args: [--config.file=/etc/blackbox/blackbox.yml]
          ports: [{name: http, containerPort: 9115}]
          securityContext:          # ICMP probes need a raw socket
            runAsUser: 0
            capabilities: {drop: [ALL], add: [NET_RAW]}
          readinessProbe: {httpGet: {path: /-/healthy, port: http}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts: [{name: config, mountPath: /etc/blackbox}]
      volumes:
        - name: config
          configMap: {name: {{ $full }}-blackbox}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-blackbox
  labels: {{- include "icc.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: blackbox}
  ports: [{name: http, port: 9115, targetPort: http}]
{{- end }}
