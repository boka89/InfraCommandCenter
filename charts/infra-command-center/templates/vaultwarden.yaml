{{- if .Values.vaultwarden.enabled }}
{{- $full := include "icc.fullname" . -}}
{{- $vw := .Values.vaultwarden -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-vaultwarden
  labels: {{- include "icc.labels" . | nindent 4 }}
    app.kubernetes.io/component: vaultwarden
spec:
  serviceName: {{ $full }}-vaultwarden
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: vaultwarden}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: vaultwarden}
    spec:
      containers:
        - name: vaultwarden
          image: {{ $vw.image }}
          env:
            - {name: DOMAIN, value: {{ $vw.domain | quote }}}
            - {name: SIGNUPS_ALLOWED, value: {{ $vw.signupsAllowed | quote }}}
            - {name: ROCKET_PORT, value: "8080"}
            {{- with $vw.adminTokenSecret }}
            - name: ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: {{ . }}, key: admin-token}}
            {{- end }}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /alive, port: http}}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ $vw.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-vaultwarden
  labels: {{- include "icc.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: vaultwarden}
  ports: [{name: http, port: 80, targetPort: http}]
{{- if $vw.ingress.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}-vaultwarden
  labels: {{- include "icc.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $vw.ingress.host | quote }}
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: {{ $full }}-vaultwarden, port: {name: http}}}}
  {{- with $vw.ingress.tlsSecretName }}
  tls: [{hosts: [{{ $vw.ingress.host | quote }}], secretName: {{ . }}}]
  {{- end }}
{{- end }}
{{- end }}
