name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: azure/setup-helm@v4
      - name: Python dependencies
        run: pip install pyyaml==6.0.2 ldap3==2.9.1
      - name: Python syntax
        run: python -m py_compile app/api/icc_api.py docker/render_nginx.py tests/*.py
      - name: JavaScript syntax
        run: for f in app/web/*.js; do node --check "$f"; done
      - name: API smoke test (local sign-in, OIDC with a mock IdP, planner, settings, activity)
        run: python tests/smoke_test.py
      - name: nginx config renders
        run: |
          ICC_METRICS_URL=http://vm:8428 ICC_DOCS_URL=https://docs.example.com ICC_GRAFANA_URL=https://grafana.example.com python docker/render_nginx.py
          docker run --rm -v /tmp/nginx:/tmp/nginx nginx:1.27-alpine nginx -t -c /tmp/nginx/nginx.conf
      - name: Container image works (build, run, sign in, read inventory)
        run: |
          docker build -t icc:ci .
          docker run -d --name icc -p 8080:8080 -e ICC_ADMIN_USER=admin -e ICC_ADMIN_PASSWORD=ci-pw -e ICC_COOKIE_SECURE=false icc:ci
          for i in $(seq 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -sf -c jar -H 'Content-Type: application/json' -d '{"user":"admin","password":"ci-pw"}' http://127.0.0.1:8080/papi/login
          curl -sf -b jar http://127.0.0.1:8080/papi/inventory.json | python -c 'import sys,json; d=json.load(sys.stdin); assert len(d["nodes"]) == 15, d'
          curl -sf -b jar http://127.0.0.1:8080/ | grep -q 'id="brand-name"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/papi/inventory.json)" = 401
          docker logs icc
      - name: Helm chart
        run: |
          helm lint charts/infra-command-center
          helm template t charts/infra-command-center > /dev/null
          helm template t charts/infra-command-center --set ingress.enabled=true --set ai.deploy.enabled=true \
            --set vaultwarden.enabled=true --set "auth.providers={local,ldap,oidc}" --set auth.oidc.existingSecret=o > /dev/null
